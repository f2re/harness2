name: unit-tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . ruff pyyaml
      - name: Ruff
        id: ruff
        run: >-
          ruff check harness2 tests scripts/native_asset_hashes.py
          scripts/check_provenance.py 2>&1 | tee ruff.log
      - name: Upload Ruff diagnostics
        if: failure() && steps.ruff.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ruff-diagnostics
          path: ruff.log
      - name: Unit tests
        id: unittest
        if: always()
        run: python -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee unittest.log
      - name: Upload unittest diagnostics
        if: failure() && steps.unittest.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: unittest-diagnostics
          path: unittest.log
      - name: Compile WorkBuddy Python overlays
        if: always()
        run: >-
          python -m py_compile
          third_party/wb_runner/agents/*.py
          third_party/wb_runner/runner/*.py
      - name: Parse WorkBuddy harness manifests
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in sorted(Path('third_party/wb_runner/configs/harnesses').rglob('*.yaml')):
              yaml.safe_load(path.read_text())
              print(path)
          PY
      - name: Verify third-party provenance
        if: always()
        run: python scripts/check_provenance.py
      - name: Generate WorkBuddy asset hashes
        if: always()
        run: python scripts/native_asset_hashes.py > native-assets.json
      - name: Upload WorkBuddy asset hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-assets-sha256
          path: native-assets.json
