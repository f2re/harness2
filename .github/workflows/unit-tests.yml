name: unit-tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and lint tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . ruff
      - name: Ruff
        id: ruff
        run: ruff check harness2 tests 2>&1 | tee ruff.log
      - name: Upload Ruff diagnostics
        if: failure() && steps.ruff.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ruff-diagnostics
          path: ruff.log
      - name: Unit tests
        if: always()
        run: python -m unittest discover -s tests -p 'test_*.py' -v
