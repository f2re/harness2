name: unit-tests

on:
  pull_request:
  push:
    branches:
      - main
      - feature/claude-antigravity-substrates

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and lint tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . ruff
      - name: Ruff
        run: ruff check harness2 tests
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
